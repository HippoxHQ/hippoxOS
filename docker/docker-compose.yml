services:
  tauri-linux:
    build:
      context: ..
      dockerfile: docker/Dockerfile.linux
    image: tauri-linux-builder:latest
    container_name: tauri-linux-build
    working_dir: /app

    volumes:
      # Mount the project root into the container at /app
      - ..:/app
      # Cargo dependency caches (reused across builds, speeds up compilation)
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      # Build artifacts land in the project root at src-tauri/target-linux,
      # so they are directly visible from Windows
      - ../src-tauri/target-linux:/app/src-tauri/target
      # Isolate node_modules to avoid Windows/Linux native binary conflicts
      - node-modules:/app/node_modules

    # Mirror selection is passed in from build-linux.ps1 via MIRROR env var.
    # Values: "en" (crates.io) or "zh" (rsproxy.cn).
    environment:
      - MIRROR=${MIRROR:-en}

    # Tauri 2 build using Yarn (Classic 1.x).
    # Yarn 1.x runs dependency build scripts by default, so no extra
    # approval flags are needed (unlike pnpm v10).
    # Cargo mirror is configured at runtime based on $MIRROR.
    command: >
      bash -c "
        set -e;
        if [ \"$MIRROR\" = \"zh\" ]; then
          mkdir -p /root/.cargo;
          printf '[source.crates-io]\nreplace-with = \"rsproxy-sparse\"\n\n[source.rsproxy-sparse]\nregistry = \"sparse+https://rsproxy.cn/index/\"\n\n[registries.rsproxy]\nindex = \"sparse+https://rsproxy.cn/index/\"\n\n[net]\ngit-fetch-with-cli = true\n' > /root/.cargo/config.toml;
          echo '[INFO] Cargo mirror: rsproxy.cn (zh)';
        else
          rm -f /root/.cargo/config.toml;
          echo '[INFO] Cargo mirror: crates.io (default/en)';
        fi;
        yarn install --frozen-lockfile &&
        yarn tauri build
      "

    stdin_open: true
    tty: true

volumes:
  cargo-registry:
  cargo-git:
  node-modules:
